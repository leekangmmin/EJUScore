        </ul>

        <h3>🤖 AI 오답 진단 리포트</h3>
        <p>틀린 문제를 입력하면 EJU 종합과목 38문항(지리 8문항, 역사 8문항, 정치 8문항, 경제 8문항, 사회 6문항) 각각에 대해 AI가 오답 원인을 분석합니다.</p>
        <ul>
          <li>4가지 오답 유형 진단: 개념 혼동, 사료 해석 오류, 그래프 변곡점 오판, 제도 구조 이해 부족</li>
          <li>오답 마인드맵 — 연관 개념 시각화</li>
          <li>우선순위별 처방전 — 집중 복습 항목 추천</li>
        </ul>

        <h3>📈 EJU 20개년 기출 트렌드 AI 분석</h3>
        <p>2006년부터 2025년까지 20년간의 EJU 기출문제를 AI가 분석합니다. 종합과목(정치, 경제, 사회, 지리, 역사)과 수학 코스1(식과 계산, 이차함수, 도형과 계량, 경우의 수와 확률, 정수론, 도형의 성질)의 출제 경향을 한눈에 파악하세요.</p>
        <ul>
          <li>연도별/주제별 빈출도 가중치 카드</li>
          <li>OCR 파이프라인 시뮬레이션 — 파일 업로드 → 토큰 추출 → LaTeX 분석 → 시러버스 매칭 → 신뢰도 앙상블</li>
          <li>코사인 유사도 기반 실시간 신뢰도 점수</li>
          <li>저신뢰도(85% 미만) 자가 교정 모달</li>
        </ul>

        <h3>🔔 D-day 시험 알림</h3>
        <p>EJU 시험일을 등록하면 D-7, D-3, D-1, D-day에 푸시 알림으로 알려드립니다. PWA로 설치하면 앱이 실행 중이 아니어도 알림을 받을 수 있습니다.</p>

        <h3>📱 PWA 크로스 플랫폼 지원</h3>
        <p>아이폰(iOS Safari → 홈 화면에 추가), 안드로이드(Chrome → 앱 설치), Windows(Edge/Chrome → 앱으로 설치)에서 네이티브 앱처럼 실행됩니다.</p>

          <li>푸시 알림 — D-day, 학습 리마인더</li>
          <li>독립 실행형 — 브라우저 URL창 없는 앱 모드</li>
        </ul>

        <hr />

        <h2>EJU 시험 관련 정보</h2>
        <p>EJU(Examination for Japanese University Admission for International Students / 日本留学試験)는 일본의 대학(학부)에 입학을 원하는 외국인 유학생을 대상으로 하는 시험입니다. 일본어 능력과 기초 학력을 평가합니다.</p>

        <h3>EJU 시험 과목</h3>
        <ul>
          <li><strong>일본어 (日本語)</strong>: 독해 200점, 청해 200점, 총 400점</li>
          <li><strong>종합과목 (総合科目)</strong>: 정치, 경제, 사회, 지리, 역사 — 200점</li>
          <li><strong>수학 코스1 (数学コース1)</strong>: 문과 계열 — 200점</li>
          <li><strong>수학 코스2 (数学コース2)</strong>: 이과 계열 — 200점</li>
          <li><strong>이과 (理科)</strong>: 물리, 화학, 생물 중 2과목 — 200점</li>
        </ul>

        <h3>EJU 관련 검색 키워드</h3>
        <p>EJU 점수, EJU 모의고사, EJU 기출문제, EJU 시험일정, EJU 접수, EJU 일본어, EJU 종합과목, EJU 수학, 일본유학시험, 일본대학 입시, 일본유학 준비, JLPT, 일본어능력시험, 일본어 독해, 일본어 청해, 일본 대학교, 동경대, 도쿄대, 교토대, 와세다대, 게이오대, 일본국공립대학, 일본사립대학, 유학생 시험, 류학시험.</p>
