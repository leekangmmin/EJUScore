<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="coverTitle coverDesc">
  <title id="coverTitle">EJU Score Tracker — Premium Cover</title>
  <desc id="coverDesc">EJU Score Tracker: AI-powered mock exam analysis for Japanese university entrance exams</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07080f"/>
      <stop offset="45%" stop-color="#0c0d1a"/>
      <stop offset="100%" stop-color="#04050a"/>
    </linearGradient>
    <radialGradient id="ambientBlue" cx="12%" cy="22%" r="55%">
      <stop offset="0%" stop-color="rgba(107,163,255,0.14)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="ambientPurple" cx="88%" cy="78%" r="50%">
      <stop offset="0%" stop-color="rgba(164,110,245,0.10)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="rgba(107,163,255,0.04)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6ba3ff"/>
      <stop offset="100%" stop-color="#a46ef5"/>
    </linearGradient>
    <linearGradient id="brandVert" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ba3ff"/>
      <stop offset="50%" stop-color="#8a7cff"/>
      <stop offset="100%" stop-color="#a46ef5"/>
    </linearGradient>
    <linearGradient id="ejuTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6ba3ff"/>
      <stop offset="100%" stop-color="#a46ef5"/>
    </linearGradient>
    <linearGradient id="subGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.3)"/>
    </linearGradient>
    <linearGradient id="glass1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.01)"/>
    </linearGradient>
    <linearGradient id="glassHover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(107,163,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(164,110,245,0.04)"/>
    </linearGradient>
    <filter id="shadowBlue">
      <feDropShadow dx="0" dy="6" stdDeviation="20" flood-color="rgba(107,163,255,0.15)"/>
    </filter>
    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#ambientBlue)"/>
  <rect width="1200" height="630" fill="url(#ambientPurple)"/>
  <rect width="1200" height="630" fill="url(#centerGlow)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.025" stroke="rgba(255,255,255,0.08)" stroke-width="0.5">
    <line x1="0" y1="90" x2="1200" y2="90"/><line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/><line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="150" y1="0" x2="150" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Decorative concentric circles -->
  <g opacity="0.035" fill="none" stroke="#6ba3ff" stroke-width="0.8">
    <circle cx="960" cy="260" r="320"/>
    <circle cx="960" cy="260" r="260"/>
    <circle cx="960" cy="260" r="200"/>
    <circle cx="960" cy="260" r="140"/>
  </g>

  <!-- Decorative triangles -->
  <g opacity="0.04" fill="none" stroke="rgba(107,163,255,0.25)" stroke-width="1">
    <polygon points="1080,80 1150,80 1115,140"/>
    <polygon points="1120,60 1165,60 1142,100"/>
    <polygon points="60,550 110,550 85,590"/>
  </g>

  <!-- Logo icon -->
  <g transform="translate(88, 292)" filter="url(#shadowBlue)">
    <circle cx="0" cy="0" r="54" fill="none" stroke="rgba(107,163,255,0.12)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="50" fill="url(#glass1)" stroke="rgba(255,255,255,0.06)" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="46" fill="none" stroke="url(#brandGrad)" stroke-width="1.2" opacity="0.6"/>
    <g transform="translate(-15, -20)">
      <path d="M0,20 L0,10 L15,2 L30,10 L30,20" fill="none" stroke="url(#brandVert)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M0,10 L15,2 L30,10" fill="url(#brandVert)" opacity="0.15" stroke="none"/>
      <path d="M30,10 L23,7 L21,20" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="15" cy="10" r="3.5" fill="#6ba3ff" opacity="0.5"/>
    </g>
    <line x1="-20" y1="24" x2="20" y2="24" stroke="url(#brandGrad)" stroke-width="2.2" stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- Main title -->
  <text x="180" y="265" font-family="system-ui,-apple-system,'Pretendard',sans-serif" font-size="90" font-weight="800" letter-spacing="-4" fill="url(#ejuTitle)" filter="url(#glowFilter)">EJU</text>
  <text x="180" y="318" font-family="system-ui,-apple-system,'Pretendard',sans-serif" font-size="26" font-weight="600" letter-spacing="12" fill="url(#subGrad)">SCORE TRACKER</text>
  <text x="180" y="358" font-family="system-ui,-apple-system,'Pretendard',sans-serif" font-size="14" font-weight="400" letter-spacing="3" fill="rgba(255,255,255,0.18)">일본유학시험 · AI 분석 · 기출 트렌드</text>

  <!-- Feature cards (right side) -->
  <g transform="translate(675, 178)">
    <rect x="0" y="0" width="440" height="54" rx="12" fill="url(#glass1)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <rect x="0" y="0" width="440" height="54" rx="12" fill="url(#glassHover)" opacity="0.5"/>
    <circle cx="30" cy="27" r="9" fill="#34d98d" opacity="0.9"/>
    <text x="52" y="33" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="500" fill="rgba(255,255,255,0.72)">AI 오답 자동 진단 및 유사도 분석</text>

    <rect x="0" y="66" width="440" height="54" rx="12" fill="url(#glass1)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <rect x="0" y="66" width="440" height="54" rx="12" fill="url(#glassHover)" opacity="0.5"/>
    <circle cx="30" cy="93" r="9" fill="#6ba3ff" opacity="0.9"/>
    <text x="52" y="99" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="500" fill="rgba(255,255,255,0.72)">종합과목 38문항 개별 정밀 스캔</text>

    <rect x="0" y="132" width="440" height="54" rx="12" fill="url(#glass1)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <rect x="0" y="132" width="440" height="54" rx="12" fill="url(#glassHover)" opacity="0.5"/>
    <circle cx="30" cy="159" r="9" fill="#f5c842" opacity="0.9"/>
    <text x="52" y="165" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="500" fill="rgba(255,255,255,0.72)">성장률 예측 · 목표 점수 도달 시뮬레이션</text>

    <rect x="0" y="198" width="440" height="54" rx="12" fill="url(#glass1)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <rect x="0" y="198" width="440" height="54" rx="12" fill="url(#glassHover)" opacity="0.5"/>
    <circle cx="30" cy="225" r="9" fill="#a46ef5" opacity="0.9"/>
    <text x="52" y="231" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="500" fill="rgba(255,255,255,0.72)">2002~2025 24개년 기출 출제 경향 분석</text>
  </g>

  <!-- Bottom accent bar -->
  <rect x="0" y="622" width="1200" height="8" fill="url(#brandGrad)" opacity="0.12"/>

  <text x="36" y="598" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="400" fill="rgba(255,255,255,0.12)">v1.3.1 · PWA · Electron · React 19</text>
  <text x="1164" y="598" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="400" text-anchor="end" fill="rgba(255,255,255,0.12)">leekangmmin.github.io/EJUScore</text>

  <circle cx="36" cy="610" r="3" fill="#6ba3ff" opacity="0.3"/>
  <circle cx="48" cy="610" r="3" fill="#8a7cff" opacity="0.2"/>
  <circle cx="60" cy="610" r="3" fill="#a46ef5" opacity="0.15"/>
</svg>
