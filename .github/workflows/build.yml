name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ── macOS DMG (arm64 + x64) ───────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite + Electron)
        run: npm run build:electron

      - name: Package macOS DMG
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: EJUScore-macOS-${{ github.sha }}
          path: release/*.dmg
          retention-days: 7

  # ── Windows NSIS (x64) ────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite + Electron)
        run: npm run build:electron

      - name: Package Windows NSIS
        run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: EJUScore-Windows-${{ github.sha }}
          path: release/*.exe
          retention-days: 7

  # ── Linux AppImage + deb ──────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Linux packaging dependencies
        run: sudo apt-get update -y && sudo apt-get install -y rpm

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite + Electron)
        run: npm run build:electron

      - name: Package Linux AppImage + deb
        run: npx electron-builder --linux --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: EJUScore-Linux-${{ github.sha }}
          path: |
            release/*.AppImage
            release/*.deb
          retention-days: 7
