# VSCode에서 main에 push하면 자동으로 macOS 앱을 빌드하고 아티팩트로 저장합니다.

name: Build macOS App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & Build React
        run: npm ci && npm run build

      - name: Copy web bundle to Xcode project
        run: |
          rm -rf EJUScore/EJUScore/www
          cp -r dist EJUScore/EJUScore/www

      - name: Build macOS App
        run: |
          xcodebuild \
            -project EJUScore/EJUScore.xcodeproj \
            -scheme EJUScore \
            -configuration Release \
            -derivedDataPath /tmp/ejubuild \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Zip .app
        run: |
          cd /tmp/ejubuild/Build/Products/Release
          zip -r EJUScore.app.zip EJUScore.app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EJUScore-macOS-${{ github.sha }}
          path: /tmp/ejubuild/Build/Products/Release/EJUScore.app.zip
          retention-days: 30
