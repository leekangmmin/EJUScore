# v1.0.0 같은 태그를 push하면 자동으로 GitHub Release가 생성됩니다.

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & Build React
        run: npm ci && npm run build

      - name: Copy web bundle to Xcode project
        run: |
          rm -rf EJUScore/EJUScore/www
          cp -r dist EJUScore/EJUScore/www

      - name: Build macOS App
        run: |
          xcodebuild \
            -project EJUScore/EJUScore.xcodeproj \
            -scheme EJUScore \
            -configuration Release \
            -derivedDataPath /tmp/ejubuild \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package .app
        run: |
          cd /tmp/ejubuild/Build/Products/Release
          zip -r EJUScore.app.zip EJUScore.app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: EJU Score Tracker ${{ github.ref_name }}
          body: |
            ## EJU Score Tracker ${{ github.ref_name }}

            **Copyright © 2025 이강민 (Lee Kangmin)**

            ### 설치 방법
            1. `EJUScore.app.zip` 다운로드
            2. 압축 해제 후 응용 프로그램 폴더로 이동
            3. 처음 실행 시 우클릭 → 열기

            > macOS 12.0 Monterey 이상 필요
          files: /tmp/ejubuild/Build/Products/Release/EJUScore.app.zip
          draft: false
          prerelease: false
