<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">EJU Score Tracker Cover</title>
  <desc id="desc">EJU score tracking app promotional cover</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="45%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1224"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f8ef7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="240" cy="170" r="190" fill="#4f8ef7" opacity="0.18" filter="url(#blur)"/>
  <circle cx="1320" cy="730" r="260" fill="#10b981" opacity="0.16" filter="url(#blur)"/>

  <g transform="translate(120 130)">
    <rect x="0" y="0" rx="30" ry="30" width="1360" height="640" fill="#0b1224" stroke="#334155" stroke-width="2"/>
    <rect x="0" y="0" rx="30" ry="30" width="1360" height="90" fill="#111a31"/>
    <text x="44" y="57" fill="#e2e8f0" font-size="30" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-weight="700">EJU Score Tracker</text>
    <circle cx="1290" cy="45" r="10" fill="#ef4444"/>
    <circle cx="1258" cy="45" r="10" fill="#f59e0b"/>
    <circle cx="1226" cy="45" r="10" fill="#10b981"/>

    <rect x="44" y="130" width="620" height="210" rx="20" fill="#111a31" stroke="#334155"/>
    <text x="78" y="184" fill="#94a3b8" font-size="22" font-family="Pretendard, Apple SD Gothic Neo, sans-serif">일본어 합계</text>
    <text x="78" y="265" fill="#4f8ef7" font-size="76" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-weight="800">338 / 400</text>

    <rect x="694" y="130" width="620" height="210" rx="20" fill="#111a31" stroke="#334155"/>
    <text x="728" y="184" fill="#94a3b8" font-size="22" font-family="Pretendard, Apple SD Gothic Neo, sans-serif">종합과목</text>
    <text x="728" y="265" fill="#10b981" font-size="76" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-weight="800">183 / 200</text>

    <rect x="44" y="372" width="1270" height="220" rx="20" fill="#111a31" stroke="#334155"/>
    <text x="78" y="420" fill="#cbd5e1" font-size="24" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-weight="600">월별 점수 추이</text>
    <polyline fill="none" stroke="#4f8ef7" stroke-width="6" points="100,520 250,500 400,460 550,430 700,420 850,390 1000,360 1150,340"/>
    <polyline fill="none" stroke="#10b981" stroke-width="6" points="100,560 250,540 400,510 550,490 700,470 850,440 1000,430 1150,410"/>
    <text x="120" y="570" fill="#64748b" font-size="18" font-family="Pretendard, Apple SD Gothic Neo, sans-serif">2025-11</text>
    <text x="1110" y="570" fill="#64748b" font-size="18" font-family="Pretendard, Apple SD Gothic Neo, sans-serif">2026-06</text>
  </g>

  <text x="120" y="845" fill="#94a3b8" font-size="26" font-family="Pretendard, Apple SD Gothic Neo, sans-serif">모의고사 점수 입력 · 자동 분석 · 성장 추적</text>
  <rect x="1090" y="798" width="390" height="60" rx="14" fill="url(#accent)"/>
  <text x="1145" y="838" fill="#ffffff" font-size="27" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-weight="700">leekangmmin / EJUScore</text>
